<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Flujo de mcp-context: los archivos del repo pasan por ChromaDB y DeepSeek y a Claude Code llega un contexto chico con archivo y linea">
  <!-- Flujo real de query_context. Los 4 archivos son los que cito una consulta
       real sobre este repo ("como se calcula el costo de cada llamada a DeepSeek"). -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p1" d="M292 200 C 320 200, 320 200, 350 200"/>
    <path id="p2" d="M530 200 L 580 200"/>
    <path id="p3" d="M760 200 L 800 200"/>
  </defs>

  <rect x="1" y="1" width="998" height="398" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- columna 1: archivos del repo -->
    <text x="40" y="58" fill="#8b949e" font-size="14" font-weight="600" letter-spacing="2">TU REPO</text>
    <g font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="14" fill="#e6edf3">
      <g>
        <rect x="40" y="76" width="252" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
        <rect x="40" y="76" width="5" height="44" rx="2" fill="#6C5CE7"/>
        <text x="58" y="103">config.py</text>
      </g>
      <g>
        <rect x="40" y="130" width="252" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
        <rect x="40" y="130" width="5" height="44" rx="2" fill="#6C5CE7"/>
        <text x="58" y="157">deepseek_client.py</text>
      </g>
      <g>
        <rect x="40" y="184" width="252" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
        <rect x="40" y="184" width="5" height="44" rx="2" fill="#6C5CE7"/>
        <text x="58" y="211">describe_project.py</text>
      </g>
      <g>
        <rect x="40" y="238" width="252" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
        <rect x="40" y="238" width="5" height="44" rx="2" fill="#6C5CE7"/>
        <text x="58" y="265">test_audit_parallel.py</text>
      </g>
      <text x="40" y="318" fill="#8b949e" font-size="13">+ el resto del repo, indexado</text>
    </g>

    <!-- conectores -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="5 6" fill="none">
      <use href="#p1"/><use href="#p2"/><use href="#p3"/>
    </g>

    <!-- etiqueta del bloque del server, sobre ChromaDB + DeepSeek -->
    <text x="555" y="58" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" letter-spacing="2">MCP-CONTEXT</text>
    <path d="M350 112 L350 104 L760 104 L760 112" fill="none" stroke="#30363d" stroke-width="2"/>

    <!-- columna 2: ChromaDB -->
    <rect x="350" y="138" width="180" height="124" rx="14" fill="#161b22" stroke="#FF6B35" stroke-width="2"/>
    <text x="440" y="186" text-anchor="middle" fill="#FF6B35" font-size="20" font-weight="700">ChromaDB</text>
    <text x="440" y="212" text-anchor="middle" fill="#c9d1d9" font-size="14">busqueda semantica</text>
    <text x="440" y="232" text-anchor="middle" fill="#8b949e" font-size="13">embeddings en CPU</text>

    <!-- columna 3: DeepSeek -->
    <rect x="580" y="138" width="180" height="124" rx="14" fill="#161b22" stroke="#4D6BFE" stroke-width="2"/>
    <text x="670" y="186" text-anchor="middle" fill="#7d93ff" font-size="20" font-weight="700">DeepSeek</text>
    <text x="670" y="212" text-anchor="middle" fill="#c9d1d9" font-size="14">filtra y comprime</text>
    <text x="670" y="232" text-anchor="middle" fill="#8b949e" font-size="13">modelo barato</text>

    <!-- columna 4: lo que recibe Claude Code -->
    <text x="880" y="58" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" letter-spacing="2">CLAUDE CODE</text>
    <g>
      <rect x="800" y="150" width="160" height="100" rx="12" fill="#0f2a1d" stroke="#3fdd78" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="880" y="186" text-anchor="middle" fill="#3fdd78" font-size="16" font-weight="700">contexto</text>
      <text x="880" y="208" text-anchor="middle" fill="#c9d1d9" font-size="14">solo lo relevante</text>
      <text x="880" y="230" text-anchor="middle" fill="#8b949e" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12">archivo:linea</text>
    </g>

    <!-- particulas que recorren el flujo -->
    <g>
      <circle r="5" fill="#a29bfe"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="5" fill="#a29bfe"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="5" fill="#ff9f6b"><animateMotion dur="1.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4" fill="#3fdd78"><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    </g>

    <!-- pie -->
    <text x="500" y="362" text-anchor="middle" fill="#8b949e" font-size="14">Claude Code pregunta en lenguaje natural; en vez de leer archivos enteros, recibe el resumen con citas exactas.</text>
  </g>
</svg>
